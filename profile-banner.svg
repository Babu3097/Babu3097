<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f24"/>
      <stop offset="55%" stop-color="#0d3b3c"/>
      <stop offset="100%" stop-color="#0d8f8b"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35d6ce"/>
      <stop offset="100%" stop-color="#0d8f8b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- faint grid, subtle data motif -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- simple bar-chart glyph, right side -->
  <g transform="translate(940,60)" opacity="0.9">
    <rect x="0"  y="90" width="26" height="50" rx="3" fill="#35d6ce" opacity="0.55"/>
    <rect x="36" y="60" width="26" height="80" rx="3" fill="#35d6ce" opacity="0.75"/>
    <rect x="72" y="30" width="26" height="110" rx="3" fill="#6ee8e1" opacity="0.9"/>
    <rect x="108" y="70" width="26" height="70" rx="3" fill="#35d6ce" opacity="0.6"/>
    <rect x="144" y="10" width="26" height="130" rx="3" fill="#6ee8e1"/>
  </g>

  <rect x="60" y="60" width="4" height="140" fill="url(#accentLine)"/>

  <text x="90" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f2fbfa">Ranjith Kumar</text>
  <text x="90" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#8fe9e2">Data &amp; AI Professional · Business Intelligence · Data Engineering · AI Agents</text>
  <text x="90" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a9c9c6">7+ years across payments analytics, business analysis &amp; operations</text>
</svg>
